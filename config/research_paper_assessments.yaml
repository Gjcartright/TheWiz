    mitigation: Use source-consistency checks, incident taxonomies, calibrated thresholds, and shadow evaluation.
    red_attack: Inject stale, duplicated, reordered, and cross-source inconsistent observations.
    red_test: Replay known outages and synthetic corruptions while preserving genuine crisis events.
    math_focus: Audit ensemble scoring, threshold calibration, class-imbalance metrics, and alert latency.
    hypothesis: A dedicated data-health anomaly ensemble can reduce contaminated backtests and unsafe testnet actions.
    data_needed: Labeled source outages, stale-data events, API errors, and clean volatile-market controls.
