review_version: paper_adversarial_review_v1
reviewed_at: "2026-08-16"
review_basis: full_text_adversarial_screen
review_authority: research_only
papers:
  paper_f0b8fced125866b5:
    relevance: direct
    strategy_families: [cointegration, reinforcement_learning, entry_exit, risk]
    evidence_verdict: mixed
    guidance: conditional
    primary_claim: A recurrent RL agent with temporal attention and a mean-variance reward can trade a cointegrated pair less frequently and with better risk-adjusted results than the tested baselines.
    claim_locator: risk-aware reward
    good: Uses rolling train-validation-test windows, transaction costs, activity metrics, and an ablation of the recurrent representation and risk reward.
    bad: The empirical study uses one selected daily US equity pair and approximately 1006 observations; the displayed Sharpe definition divides by variance rather than standard deviation.
    do: Test temporal state encoders and risk-aware rewards as research-only challengers against deterministic strategies.
    dont: Do not import the reported Sharpe values, pair selection, or model weights as validated evidence.
    neither: The human-expertise analogy is narrative and creates no operational permission.
    gap: Reproduce the reward timing, cost coefficient, hedge construction, and Sharpe calculation on crypto perpetual data with purged walk-forward folds.
    gap_severity: critical
    premortem: The agent appears stable in backtests but learned one pair's path and suppresses trading rather than learning transferable entry and exit logic.
    warning: Performance collapses when the original pair or best rolling windows are removed, or take-rate approaches zero.
    mitigation: Use multiple pairs, nested walk-forward selection, minimum take-rate, pair concentration limits, and deterministic baselines.
    red_attack: Recompute every reported metric with the standard Sharpe denominator and challenge the bidirectional encoder for decision-time leakage.
    red_test: Shift all features by one bar, remove the best fold, replace the reward with matched mean-variance controls, and run seed dispersion.
    math_focus: Verify U(r)=log(1+r), its quadratic approximation, the alpha scaling, reward horizon, and whether V denotes variance or volatility.
    hypothesis: A causal recurrent state encoder plus an explicitly scaled downside-risk reward can reduce unnecessary pair turnover without collapsing after-cost take-rate.
    data_needed: Point-in-time Hyperliquid candles, funding, fees, observed spread/slippage, multiple pairs, and exact action logs.
    confidence: 0.72

  paper_9acd25bc0eb74b5f:
    relevance: high
    strategy_families: [reinforcement_learning, tail_risk, risk]
    evidence_verdict: mixed
    guidance: conditional
    primary_claim: Peaks-over-threshold extreme-value estimates can improve policy-gradient control of rare catastrophic cumulative losses when empirical tail observations are scarce.
    claim_locator: peaks-over-threshold
    good: Targets a real weakness of variance-only rewards and exposes threshold selection and generalized Pareto assumptions.
    bad: Evidence is simulation and option-hedging focused, while the finite-difference gradient is limited to low-dimensional policies.
    do: Use EVT estimates as a risk critic or veto candidate, separate from alpha generation.
    dont: Do not treat fitted tail estimates from a small crypto sample as stable or use them without threshold diagnostics.
    neither: Option-pricing performance does not establish pairs-trading profitability.
    gap: Establish enough independent tail exceedances, threshold stability, and online update behavior for pair PnL and liquidation loss.
    gap_severity: high
    premortem: The tail model becomes unstable precisely during regime change and gives a false sense of protection.
    warning: Shape estimates change sign across nearby thresholds or CVaR estimates swing sharply with one observation.
    mitigation: Use threshold ensembles, uncertainty bounds, conservative fallback limits, and deterministic liquidation controls.
    red_attack: Replace the tail with mixtures and clustered losses that violate iid generalized-Pareto approximations.
    red_test: Block-bootstrap exceedances, vary thresholds, inject structural breaks, and compare against empirical CVaR plus hard limits.
    math_focus: Reproduce POT threshold selection, GPD likelihood, CVaR approximation, and finite-difference policy gradient.
    hypothesis: An EVT tail-risk critic can improve RL sizing or vetoes beyond empirical CVaR without degrading ordinary-regime opportunity capture.
    data_needed: Long costed trade-level PnL, drawdowns, liquidation distances, and regime labels.
    confidence: 0.7

  paper_d4fcf1eb3a126f63:
    relevance: contextual
    strategy_families: [sentiment, regime]
    evidence_verdict: mixed
    guidance: monitor
    primary_claim: Social-network attention herding and sentiment contain information about retail trading and subsequent equity returns.
    claim_locator: attention herding
    good: Distinguishes stock-specific attention from forum-wide herding and uses a large, manually seeded text classification exercise.
    bad: The setting is US equities and WallStreetBets, includes exceptional meme-stock episodes, and depends on platform and holdings data not available for Hyperliquid.
    do: Treat broad attention concentration as a possible crowded-trade or crisis-regime feature.
    dont: Do not transfer equity return coefficients or contrarian direction directly to crypto.
    neither: Forum sentiment by itself does not select a hedge ratio or pair direction.
    gap: Build point-in-time crypto attention data and test incremental value beyond funding, volume, volatility, and open interest.
    gap_severity: medium
    premortem: A sentiment feature chases already-completed moves and increases entries at maximum crowding.
    warning: Signal value disappears after publication delays and realistic timestamping.
    mitigation: Timestamp every post, impose availability lags, and use sentiment only as a conditional regime feature.
    red_attack: Remove GME and AMC, split by platform era, and control for contemporaneous volatility and turnover.
    red_test: Run embargoed event studies and placebo timestamps on crypto attention series.
    math_focus: Audit portfolio formation, factor adjustment, classifier calibration, and overlapping-return inference.
    hypothesis: Crypto-wide attention concentration may identify regimes in which mean-reversion entries should be reduced or delayed.
    data_needed: Point-in-time crypto social data with immutable timestamps and market-control features.
    confidence: 0.58

  paper_03e6cc68db1b1e83:
