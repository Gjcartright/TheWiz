  paper_ce12da98cbbace4d:
    relevance: high
    strategy_families: [crypto, portfolio, tail_risk, sizing]
    evidence_verdict: mixed
    guidance: conditional
    primary_claim: A pessimistic Choquet-integral portfolio using higher moments and CVaR can improve crypto tail-risk outcomes relative to mean-variance and naive allocations.
    claim_locator: Choquet portfolio
    good: Directly studies cryptocurrency, nonlinear dependence, tail risk, and interpretable contribution measures.
    bad: Portfolio allocation is not pair-entry evidence; optimizer stability, turnover, and live execution assumptions require independent verification.
    do: Test Choquet or CVaR concepts as portfolio-level pair sizing and concentration controls.
    dont: Do not use Shapley or LIME explanations as causal proof or permit the allocator to create signals.
    neither: Reported cumulative portfolio returns do not validate any Wizard mode.
    gap: Reproduce the capacity construction, higher-moment estimation, rebalance costs, and stability on pair-strategy returns rather than coin returns.
    gap_severity: high
    premortem: Estimated nonlinear capacities overfit a small crypto universe and flip weights after minor data changes.
    warning: Large allocation changes occur under nearby windows or bootstrap samples.
    mitigation: Shrink capacities, cap concentration and turnover, and compare against simple CVaR and equal-risk baselines.
    red_attack: Perturb returns, remove BTC, vary rebalance dates, and impose stressed costs and funding.
    red_test: Nested walk-forward allocation using only realized pair-strategy returns available at rebalance time.
    math_focus: Reproduce the Choquet capacity, alpha-CVaR formulation, higher moments, Shapley attribution, and constraint set.
    hypothesis: A conservative nonlinear allocator can reduce portfolio tail loss across validated pair strategies without unstable concentration.
    data_needed: Point-in-time strategy returns, covariance and tail estimates, funding, costs, and capacity constraints.
    confidence: 0.69

