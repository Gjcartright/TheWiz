    evidence_verdict: mixed
    guidance: monitor
    primary_claim: Past aggressive institutional trading predicts future information advantage and a cross-sectional equity return premium.
    claim_locator: information asymmetry
    good: Uses holdings-based measures intended to observe informed-versus-uninformed wealth transfers directly.
    bad: Shanghai equity holdings and institutional classifications are unavailable and structurally different from pseudonymous perpetual markets.
    do: Treat information asymmetry as motivation for liquidity and adverse-selection controls.
    dont: Do not map the reported 10.8 percent equity spread into crypto expected returns.
    neither: The finding does not identify cointegration or a pair spread.
