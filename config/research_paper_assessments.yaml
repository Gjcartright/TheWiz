    claim_locator: graph-based decision-support
    good: Directly compares graph and non-graph representations and discusses prediction instability and refresh cost.
    bad: The task, labels, graph semantics, and operating cadence differ from market prediction.
    do: Reuse the graph-reconciliation idea for evidence lineage, symbol mapping, and multi-source entity matching.
    dont: Do not use bank-reconciliation accuracy as evidence for trading alpha or pair dependence.
    neither: Bookkeeper workflow findings are not market features.
    gap: Define TheWiz graph entities, relation types, temporal validity, and confidence-aware match review.
    gap_severity: medium
    premortem: Incorrect graph links merge unrelated symbols or venues and contaminate every downstream dataset.
    warning: One asset maps to multiple canonical entities without a reviewable reason.
    mitigation: Require deterministic identifiers, temporal edges, confidence thresholds, and human-review queues.
    red_attack: Inject ambiguous tickers, renamed tokens, bridged assets, and conflicting venue metadata.
    red_test: Measure precision and recall on a hand-labeled crypto entity-resolution set.
    math_focus: Verify similarity construction, threshold selection, calibration, and grouped-match metrics.
    hypothesis: A temporal evidence graph can reduce symbol and source-reconciliation errors without granting signal authority.
    data_needed: Hand-labeled cross-venue symbol, contract, chain, and source mappings.
    confidence: 0.64

