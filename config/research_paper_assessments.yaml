  paper_5202676052f4c33f:
    relevance: high
    strategy_families: [regime, volatility, distribution]
    evidence_verdict: inconclusive
    guidance: monitor
    primary_claim: High-frequency return-distribution sequences have low-dimensional, time-varying multifractal structure measurable with Wasserstein distance and Renyi indices.
    claim_locator: Wasserstein distance
    good: Treats the full return distribution as an evolving object and compares against a Gaussian benchmark.
    bad: The study is descriptive; it does not establish point-in-time predictive value, tradability, or robustness across venues.
    do: Test the metrics as regime descriptors alongside simpler volatility and tail features.
    dont: Do not infer alpha from attractive UMAP clusters or fractal labels.
    neither: Two-dimensional cluster shape is visualization, not a trading rule.
    gap: Define causal windows, estimator uncertainty, update cost, and incremental predictive value for pair outcomes.
    gap_severity: high
    premortem: Complex multifractal features reproduce volatility under a new name and overfit tiny windows.
    warning: They add no value after mean, volatility, skew, and kurtosis controls.
    mitigation: Benchmark against simple features, bootstrap stability, and pre-register target outcomes.
    red_attack: Use Gaussian and GARCH surrogates with matched moments to see whether the metric is genuinely new.
    red_test: Purged walk-forward prediction of strategy failure, not contemporaneous crisis classification.
    math_focus: Reproduce Wasserstein distances, correlation dimension, generalized dimension, and Renyi-index estimators.
    hypothesis: Distribution-shape features may identify regimes in which spread reversion becomes less reliable beyond standard volatility measures.
    data_needed: High-frequency point-in-time returns across many Hyperliquid assets and matched surrogate processes.
    confidence: 0.6

  paper_9d33d77526db17f3:
    relevance: high
    strategy_families: [execution_costs, exit, sizing]
    evidence_verdict: mixed
    guidance: conditional
    primary_claim: With transaction costs, optimal portfolio rebalancing occurs at the boundary of a time-varying no-trade region rather than on a fixed schedule.
    claim_locator: no-trade region
    good: Provides a clear economic mechanism for hysteresis and explicitly includes transaction costs.
    bad: Market-variability results are simulation-heavy and concern asset-class portfolios, not two-leg perpetual execution.
    do: Test no-trade bands for pair rehedging, scaling, and exit hysteresis.
    dont: Do not assume the theoretical boundary survives funding, discrete sizes, leverage, and asynchronous fills.
    neither: Claims about aggregate market variability do not validate TheWiz profitability.
    gap: Derive the boundary under two-leg costs, funding, minimum sizes, margin, and observed Hyperliquid execution.
    gap_severity: high
    premortem: The band is too wide during drift and turns cost savings into uncontrolled hedge error.
    warning: Exposure and drawdown rise while turnover falls.
    mitigation: Add maximum hedge-error, time, and regime exits with dynamic cost estimates.
    red_attack: Stress nonstationary volatility, jumps, asymmetric costs, and one-leg fill delays.
    red_test: Compare continuous rehedging, fixed cadence, static bands, and dynamic bands after observed costs.
    math_focus: Reproduce the utility objective, transaction-cost boundary, and inhomogeneous drift-volatility extension.
    hypothesis: A dynamic cost-aware no-trade region can reduce unnecessary rehedging without increasing hedge error or tail loss.
    data_needed: Position-level pair exposures, L2-derived costs, funding, fills, and volatility forecasts.
    confidence: 0.74

  paper_bd860d3475116e96:
    relevance: direct
    strategy_families: [pairs_trading, ou, deep_learning, crypto]
    evidence_verdict: mixed
    guidance: conditional
    primary_claim: Panel-trained time-series models that forecast factor residual direction can outperform a classical OU relative-value baseline with lower turnover across equity and crypto samples.
    claim_locator: transaction cost sensitivity
    good: Includes crypto, rolling factor residuals, survivorship-aware equity membership, cost sensitivity, block-bootstrap Sharpe intervals, and false-discovery control; code is identified.
    bad: Uses daily data and a basic proportional cost model that explicitly omits bid-ask spread; deployability is disclaimed and dataset/code reproduction is still required.
    do: Prioritize a bounded reproduction of the panel residual-direction gate using the simplest model first.
    dont: Do not start with large transformers or accept reported Sharpe ratios before reproducing timestamps, universe formation, and costs.
    neither: Architecture rankings among overlapping confidence intervals should not drive model choice.
    gap: Verify code-data parity, exact splits, residual construction, crypto universe survivorship, funding, spread, slippage, and pair-leg neutrality.
    gap_severity: critical
    premortem: A high-capacity model learns cross-sectional membership and market beta, then fails on new assets and intraday perpetual data.
    warning: Gains disappear under unseen-pair tests, simple logistic baselines, or observed execution costs.
    mitigation: Begin with linear and shallow models, use pair and time embargoes, and require incremental value over TheWiz signals.
    red_attack: Hold out entire assets and regimes, neutralize beta, include funding and bid-ask costs, and test stale-universe leakage.
    red_test: Reproduce published daily results first, then run nested Hyperliquid walk-forward with unseen-pair folds.
    math_focus: Reconcile PCA factor residuals, OU equations, signal thresholds, annualization, turnover, cost subtraction, bootstrap, and FDR procedures.
    hypothesis: A low-capacity panel model predicting next-bar residual direction can gate existing spread entries and improve after-cost results without losing neutrality.
    data_needed: Reproduction code and data, point-in-time crypto universe, Hyperliquid candles, funding, L2 costs, and exact factor snapshots.
    confidence: 0.82

