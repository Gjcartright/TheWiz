[project]
name = "quantized-stat-arb-platform"
version = "0.1.0"
description = "Research-first statistical arbitrage platform for crypto pair trading."
requires-python = ">=3.11"
dependencies = [
  # Python 3.12 numerical versions are bound by the Wizard comparator contract.
  "numpy>=1.26,<2.5; python_version < '3.12'",
  "numpy==2.5.1; python_version >= '3.12'",
  "pandas>=2.1,<3.0.4; python_version < '3.12'",
  "pandas==3.0.3; python_version >= '3.12'",
  "pyarrow>=16.0",
  "pydantic>=2.6",
  "scipy>=1.11,<1.18; python_version < '3.12'",
  "scipy==1.18.0; python_version >= '3.12'",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "requests>=2.31",
  "eth-account>=0.13,<0.14",
  "hyperliquid-python-sdk>=0.23,<0.24",
  "pyyaml>=6.0",
  "langgraph>=0.2",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dydx = [
  "dydx-v4-client>=1.1.5",
]
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
]
youtube = [
  "yt-dlp>=2024.7.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# These modules contain functions bound into immutable comparator source hashes.
exclude = [
  "src/quant_platform/wizard_hyperliquid_mode_proof.py",
  "src/quant_platform/orchestration/corrective_wizard_ou_holdout.py",
  "src/quant_platform/orchestration/corrective_wizard_ou_v4_holdout.py",
  "src/quant_platform/orchestration/corrective_wizard_ou_v5_holdout.py",
]
