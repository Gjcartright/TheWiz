name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv
          uv sync --extra dev --locked
      - name: Compile source
        run: uv run python -m compileall -q -x '(^|/)\._' src scripts
      - name: Check correctness lint
        run: uv run ruff check src tests scripts --select E9,F63,F7,F82 --extend-exclude '._*'
      - name: Check dependency consistency
        run: uv pip check --python .venv/bin/python
      - name: Run tests
        run: uv run --locked python -m pytest -q
